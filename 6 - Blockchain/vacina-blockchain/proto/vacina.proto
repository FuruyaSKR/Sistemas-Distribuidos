syntax = "proto3";

service VaccineService {
  rpc RegisterVaccine (VaccineInput) returns (VaccineResponse);
  rpc GetVaccine (VaccineQuery) returns (VaccineInfo);
}

message VaccineInput {
  string cpf = 1;
  string tipo = 2;
  string data = 3;
}

message VaccineQuery {
  string cpf = 1;
  uint32 index = 2;
}

message VaccineResponse {
  string status = 1;
  string txHash = 2;
}

message VaccineInfo {
  string tipo = 1;
  string data = 2;
}
